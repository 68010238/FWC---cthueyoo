<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Responsive Table</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    table {
      width: 100%;
      height: 100%;
      border: 10px solid black;
      border-collapse: collapse;
      table-layout: fixed;
    }

    td {
      text-align: center;
      vertical-align: middle;
      border: 5px solid black;
    }

    h1 {
      font-size: 5vw;
      margin: 0;
    }
  </style>
</head>
<body>

<table>
  <tr>
    <td style="background-color: lightgreen;">
      <h1>First cell</h1>
    </td>
    <td style="background-color: lightpink;">
      <h1>Second cell</h1>
    </td>
  </tr>
</table>

</body>
</html>
