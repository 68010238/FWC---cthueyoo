<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 3em;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .shop {
            text-align: center;
        }

        .shop img {
            width: 200px;
            height: 150px;
        }

        .shop a {
            display: block;
            margin-top: 10px;
        }

        hr {
            margin-top: 30px;
            width: 100%;
        }

        footer {
            text-align: right;
            font-style: italic;
            font-family: monospace;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Welcome to my Shop List &hearts;</h1>

    <div class="shops">
        <div class="shop">
            <img src="https://deo.shopeemobile.com/shopee/shopee-pcmall-live-sg/assets/ca5d12864c12916c05640b36e47ac5c9.png" alt="Shopee">
            <a href="https://shopee.co.th" target="_blank">Shopee</a>
        </div>
        <div class="shop">
            <img src="https://www.lnwshop.com/system/application/modules/lnwshopweb/_images/store/logo/m_lazada.png" alt="Lazada">
            <a href="https://www.lazada.co.th" target="_blank">Lazada</a>
        </div>
    </div>

    <hr>

    <footer>
        &copy; cthueyoo_login 2026
    </footer>

</body>
</html>
