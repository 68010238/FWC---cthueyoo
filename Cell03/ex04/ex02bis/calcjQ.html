<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>It's over 9000</title>
  <link rel="stylesheet" href="calcjQ.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

  <form id="calc-form">
    <input type="text" id="left" placeholder="Left member">

    <select id="operator">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
      <option value="%">%</option>
    </select>

    <input type="text" id="right" placeholder="Right member">

    <input type="submit" value="Try me!">
  </form>

  <script src="calcjQ.js"></script>
</body>
</html>
